<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe to Newsletter - Rizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 text-center">
                <div class="card-body p-5">
                    <h3 class="fw-bold mb-3">Stay Updated!</h3>
                    <p class="text-muted mb-4">Subscribe to our newsletter to get the latest news and offers from Rizertech.</p>
                    
                    <div id="newsletterAlert" class="alert d-none" role="alert"></div>
                    
                    <form id="newsletterForm">
                        <div class="input-group mb-3">
                            <input type="email" class="form-control form-control-lg" id="newsletter_email" placeholder="Enter your email address" required>
                            <button class="btn btn-primary px-4" type="submit" id="submitBtn">Subscribe</button>
                        </div>
                    </form>
                    <small class="text-muted">We respect your privacy. No spam.</small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://wctbdqunrifopbnjisxi.supabase.co';
    const supabaseKey = 'sb_publishable_q0VN3NfdSy8Gth-vH2eNeg_iUNNBX_x';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('newsletterForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('newsletterAlert');
        
        btn.disabled = true;
        btn.innerHTML = '...';
        alertBox.classList.add('d-none');
        
        const payload = {
            email: document.getElementById('newsletter_email').value
        };

        const { error } = await supabase.from('newsletter_subscribers').insert([payload]);

        if (error) {
            console.error('Error:', error);
            alertBox.className = 'alert alert-danger';
            alertBox.innerHTML = 'You are already subscribed or an error occurred.';
        } else {
            alertBox.className = 'alert alert-success';
            alertBox.innerHTML = 'Thank you for subscribing!';
            document.getElementById('newsletterForm').reset();
        }

        btn.disabled = false;
        btn.innerHTML = 'Subscribe';
    });
</script>
</body>
</html>
