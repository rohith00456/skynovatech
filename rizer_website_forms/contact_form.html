<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Rizer</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Contact Us</h4>
                </div>
                <div class="card-body p-4">
                    <div id="contactFormAlert" class="alert d-none" role="alert"></div>
                    <form id="contactForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label">Your Name</label>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">Your Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label">Phone</label>
                                <input type="text" class="form-control" id="phone" name="phone">
                            </div>
                            <div class="col-md-6">
                                <label for="subject" class="form-label">Subject</label>
                                <input type="text" class="form-control" id="subject" name="subject" required>
                            </div>
                            <div class="col-12">
                                <label for="message" class="form-label">Message</label>
                                <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                            </div>
                            <div class="col-12 text-center mt-4">
                                <button type="submit" class="btn btn-primary px-5" id="submitBtn">Send Message</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Initialize Supabase
    const supabaseUrl = 'https://wctbdqunrifopbnjisxi.supabase.co';
    const supabaseKey = 'sb_publishable_q0VN3NfdSy8Gth-vH2eNeg_iUNNBX_x';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('contactForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('contactFormAlert');
        
        // Disable button & show loading state
        btn.disabled = true;
        btn.innerHTML = 'Sending...';
        alertBox.classList.add('d-none');
        
        // Gather data
        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            subject: document.getElementById('subject').value,
            message: document.getElementById('message').value,
            source: 'website_contact'
        };

        // Insert into Supabase
        const { error } = await supabase.from('lead_captures').insert([payload]);

        if (error) {
            console.error('Error submitting form:', error);
            alertBox.className = 'alert alert-danger mt-3';
            alertBox.innerHTML = 'An error occurred. Please try again.';
        } else {
            alertBox.className = 'alert alert-success mt-3';
            alertBox.innerHTML = 'Your message has been sent successfully. We will get back to you soon!';
            document.getElementById('contactForm').reset();
        }

        // Re-enable button
        btn.disabled = false;
        btn.innerHTML = 'Send Message';
    });
</script>
</body>
</html>
