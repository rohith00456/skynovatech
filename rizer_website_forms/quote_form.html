<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote - Rizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Request a Free Quote</h4>
                </div>
                <div class="card-body p-4 bg-light">
                    <div id="quoteFormAlert" class="alert d-none" role="alert"></div>
                    <form id="quoteForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="text" class="form-control" id="phone">
                            </div>
                            <div class="col-md-6">
                                <label for="main_service" class="form-label">Service Required</label>
                                <select class="form-select" id="main_service" required>
                                    <option value="" disabled selected>Select a Service</option>
                                    <option value="Web Development">Web Development</option>
                                    <option value="Mobile App Development">Mobile App Development</option>
                                    <option value="Digital Marketing">Digital Marketing</option>
                                    <option value="Software Development">Software Development</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label for="detailed_service" class="form-label">Project Details (Optional)</label>
                                <input type="text" class="form-control" id="detailed_service" placeholder="e.g. E-commerce app, SEO optimization">
                            </div>
                            <div class="col-12">
                                <label for="message" class="form-label">Message</label>
                                <textarea class="form-control" id="message" rows="4"></textarea>
                            </div>
                            <div class="col-12 text-center mt-4">
                                <button type="submit" class="btn btn-dark px-5" id="submitBtn">Get Quote</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://wctbdqunrifopbnjisxi.supabase.co';
    const supabaseKey = 'sb_publishable_q0VN3NfdSy8Gth-vH2eNeg_iUNNBX_x';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('quoteForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('quoteFormAlert');
        
        btn.disabled = true;
        btn.innerHTML = 'Submitting...';
        alertBox.classList.add('d-none');
        
        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            main_service: document.getElementById('main_service').value,
            detailed_service: document.getElementById('detailed_service').value,
            message: document.getElementById('message').value,
        };

        const { error } = await supabase.from('quote_requests').insert([payload]);

        if (error) {
            console.error('Error:', error);
            alertBox.className = 'alert alert-danger';
            alertBox.innerHTML = 'An error occurred. Please try again.';
        } else {
            alertBox.className = 'alert alert-success';
            alertBox.innerHTML = 'Quote request received! We will contact you shortly.';
            document.getElementById('quoteForm').reset();
        }

        btn.disabled = false;
        btn.innerHTML = 'Get Quote';
    });
</script>
</body>
</html>
