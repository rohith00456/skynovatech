<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Internship - Skynova</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light">
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Internship Application</h4>
                </div>
                <div class="card-body p-4">
                    <div id="internFormAlert" class="alert d-none" role="alert"></div>
                    <form id="internForm">
                        <h5 class="mb-3 text-success border-bottom pb-2">Personal Details</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="name" class="form-label">Full Name *</label>
                                <input type="text" class="form-control" id="name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email Address *</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="col-md-6">
                                <label for="contact" class="form-label">Contact Number *</label>
                                <input type="text" class="form-control" id="contact" required>
                            </div>
                            <div class="col-md-6">
                                <label for="whatsapp" class="form-label">WhatsApp Number</label>
                                <input type="text" class="form-control" id="whatsapp">
                            </div>
                            <div class="col-md-6">
                                <label for="dob" class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" id="dob">
                            </div>
                            <div class="col-md-6">
                                <label for="gender" class="form-label">Gender</label>
                                <select class="form-select" id="gender">
                                    <option value="" disabled selected>Select</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>

                        <h5 class="mb-3 text-success border-bottom pb-2">Education Details</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-12">
                                <label for="college" class="form-label">College / University Name *</label>
                                <input type="text" class="form-control" id="college" required>
                            </div>
                            <div class="col-md-4">
                                <label for="degree" class="form-label">Degree</label>
                                <input type="text" class="form-control" id="degree" placeholder="e.g. B.Tech">
                            </div>
                            <div class="col-md-4">
                                <label for="department" class="form-label">Department / Branch</label>
                                <input type="text" class="form-control" id="department" placeholder="e.g. CSE">
                            </div>
                            <div class="col-md-4">
                                <label for="year" class="form-label">Year of Study</label>
                                <select class="form-select" id="year">
                                    <option value="" disabled selected>Select</option>
                                    <option value="1st Year">1st Year</option>
                                    <option value="2nd Year">2nd Year</option>
                                    <option value="3rd Year">3rd Year</option>
                                    <option value="4th Year">4th Year</option>
                                    <option value="Passed Out">Passed Out</option>
                                </select>
                            </div>
                        </div>

                        <h5 class="mb-3 text-success border-bottom pb-2">Internship Preferences</h5>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="domain" class="form-label">Preferred Domain *</label>
                                <select class="form-select" id="domain" required>
                                    <option value="" disabled selected>Select Domain</option>
                                    <option value="Frontend Development">Frontend Development</option>
                                    <option value="Backend Development">Backend Development</option>
                                    <option value="Full Stack Development">Full Stack Development</option>
                                    <option value="Data Science">Data Science</option>
                                    <option value="Digital Marketing">Digital Marketing</option>
                                    <option value="Graphic Design">Graphic Design</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="duration" class="form-label">Duration</label>
                                <select class="form-select" id="duration">
                                    <option value="1 Month">1 Month</option>
                                    <option value="2 Months">2 Months</option>
                                    <option value="3 Months">3 Months</option>
                                    <option value="6 Months">6 Months</option>
                                </select>
                            </div>
                            <div class="col-12 mt-4 text-center">
                                <button type="submit" class="btn btn-success px-5 py-2 fw-bold" id="submitBtn">Submit Application</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://wctbdqunrifopbnjisxi.supabase.co';
    const supabaseKey = 'sb_publishable_q0VN3NfdSy8Gth-vH2eNeg_iUNNBX_x';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('internForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('internFormAlert');
        
        btn.disabled = true;
        btn.innerHTML = 'Submitting...';
        alertBox.classList.add('d-none');
        
        const payload = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            contact: document.getElementById('contact').value,
            whatsapp: document.getElementById('whatsapp').value,
            dob: document.getElementById('dob').value || null,
            gender: document.getElementById('gender').value,
            college: document.getElementById('college').value,
            degree: document.getElementById('degree').value,
            department: document.getElementById('department').value,
            year: document.getElementById('year').value,
            domain: document.getElementById('domain').value,
            duration: document.getElementById('duration').value
        };

        const { error } = await supabase.from('intern_applications').insert([payload]);

        if (error) {
            console.error('Error:', error);
            alertBox.className = 'alert alert-danger mb-4';
            alertBox.innerHTML = 'An error occurred. Please try again.';
        } else {
            alertBox.className = 'alert alert-success mb-4';
            alertBox.innerHTML = 'Application submitted successfully! We will review your profile.';
            document.getElementById('internForm').reset();
        }

        btn.disabled = false;
        btn.innerHTML = 'Submit Application';
    });
</script>
</body>
</html>
